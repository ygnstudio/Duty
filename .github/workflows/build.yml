name: Build and Release

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0, v1.0.0 等 tag 时触发
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write    # Required to create GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build executable
        run: swift build -c release

      - name: Create app bundle
        run: |
          BIN_DIR=$(swift build --show-bin-path -c release)
          APP_NAME="Duty"
          APP_DIR="${APP_NAME}.app"

          echo "Binary directory: ${BIN_DIR}"
          echo "Contents:"
          ls -la "${BIN_DIR}/"

          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"

          # Executable
          EXEC="${BIN_DIR}/${APP_NAME}"
          if [ ! -f "$EXEC" ]; then
            echo "ERROR: Executable not found at ${EXEC}"
            exit 1
          fi
          cp "${EXEC}" "${APP_DIR}/Contents/MacOS/${APP_NAME}"
          chmod +x "${APP_DIR}/Contents/MacOS/${APP_NAME}"
          echo "✅ Copied executable"

          # Resources bundle
          BUNDLE="${BIN_DIR}/${APP_NAME}_${APP_NAME}.bundle"
          if [ -d "$BUNDLE" ]; then
            cp -R "$BUNDLE" "${APP_DIR}/Contents/Resources/"
            echo "✅ Copied resources bundle"
          else
            echo "⚠️  Resource bundle not found, searching..."
            BUNDLE=$(find "${BIN_DIR}" -name "*.bundle" -type d | head -1)
            if [ -d "$BUNDLE" ]; then
              cp -R "$BUNDLE" "${APP_DIR}/Contents/Resources/"
              echo "✅ Copied resources from ${BUNDLE}"
            fi
          fi

          # App icon
          if [ -f "AppIcon.icns" ]; then
            cp AppIcon.icns "${APP_DIR}/Contents/Resources/AppIcon.icns"
          fi

          # PkgInfo
          echo -n 'APPL????' > "${APP_DIR}/Contents/PkgInfo"

          # Info.plist — 不设 LSUIElement，由代码 NSApp.setActivationPolicy 控制
          cat > "${APP_DIR}/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>Duty</string>
              <key>CFBundleIdentifier</key><string>com.ygnstudio.Duty</string>
              <key>CFBundleName</key><string>Duty</string>
              <key>CFBundleDisplayName</key><string>Duty</string>
              <key>CFBundleIconFile</key><string>AppIcon</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSMinimumSystemVersion</key><string>14.0</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # 版本号取自 tag（v1.0.0 → 1.0.0），手动触发时回退 0.0.0
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_EVENT_NAME}" != "push" ] && VERSION="0.0.0"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "${APP_DIR}/Contents/Info.plist"
          echo "✅ Version set to ${VERSION}"

          # Ad-hoc code sign（必须在 Info.plist 修改之后，否则签名失效）
          codesign --force --deep --sign - "${APP_DIR}"

          echo "✅ App bundle created: ${APP_DIR}"

      - name: Package as DMG
        run: |
          APP_DIR="Duty.app"
          DMG_NAME="Duty.dmg"

          # Create a temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -R "${APP_DIR}" dmg_contents/
          ln -s /Applications dmg_contents/Applications

          # Create DMG
          hdiutil create -volname "Duty" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            "${DMG_NAME}"

          echo "✅ DMG created: ${DMG_NAME}"
          ls -lh "${DMG_NAME}"

      - name: Upload Artifact (DMG)
        uses: actions/upload-artifact@v4
        with:
          name: Duty
          path: Duty.dmg
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Duty.dmg
          body: |
            ## Duty ${{ github.ref_name }}

            A macOS menu bar utility to lock file extensions to specific applications.

            ### Installation

            1. Download `Duty.dmg`
            2. Open the DMG and drag `Duty.app` to `/Applications`
            3. Right-click `Duty.app` → Open (first launch)
            4. Optional: install [duti](https://github.com/moretension/duti) (`brew install duti`) for better UTI detection of rare extensions

            ### Changes

            - See [commits](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

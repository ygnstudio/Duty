name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: swift build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build (release)
        run: swift build -c release

      - name: Build (debug)
        run: swift build
